<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#1de9b6" />
    </linearGradient>
    <linearGradient id="grid-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Decorative Tech Grid Background -->
  <g opacity="0.08" stroke="#00f2fe" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200" />
    <path d="M100 0 V420 M200 0 V420 M300 0 V420 M400 0 V420 M500 0 V420 M600 0 V420 M700 0 V420 M800 0 V420 M900 0 V420 M1000 0 V420 M1100 0 V420" />
  </g>

  <!-- Candlestick Visualizer on Top Right -->
  <g opacity="0.45" transform="translate(820, 80)">
    <!-- Bullish Candle 1 -->
    <line x1="40" y1="20" x2="40" y2="180" stroke="#00e676" stroke-width="2"/>
    <rect x="25" y="50" width="30" height="90" rx="4" fill="#00e676" opacity="0.8"/>
    <!-- Bearish Candle 2 -->
    <line x1="110" y1="40" x2="110" y2="210" stroke="#ef4444" stroke-width="2"/>
    <rect x="95" y="70" width="30" height="110" rx="4" fill="#ef4444" opacity="0.8"/>
    <!-- Bullish Candle 3 -->
    <line x1="180" y1="10" x2="180" y2="160" stroke="#00e676" stroke-width="2"/>
    <rect x="165" y="30" width="30" height="85" rx="4" fill="#00e676" opacity="0.8"/>
    <!-- Bullish Big Candle 4 -->
    <line x1="250" y1="0" x2="250" y2="150" stroke="#00e676" stroke-width="2"/>
    <rect x="235" y="15" width="30" height="115" rx="4" fill="#00e676" opacity="0.8"/>
    <!-- Moving Average Lines -->
    <path d="M10 140 Q 90 120, 160 80 T 320 20" fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#glow)"/>
    <path d="M10 160 Q 90 145, 170 110 T 320 50" fill="none" stroke="#f59e0b" stroke-width="2"/>
  </g>

  <!-- Main Branding -->
  <g transform="translate(80, 95)">
    <!-- Sub-badge -->
    <rect x="0" y="0" width="260" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="15" r="5" fill="#00e676" />
    <text x="30" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">v16.2.0 TURBO-50 LIVE</text>

    <!-- Main Title -->
    <text x="0" y="90" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      XM <tspan fill="url(#accent-cyan)">AI Scalping</tspan> Bot
    </text>

    <!-- Subtitle -->
    <text x="0" y="130" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">
      Enterprise Institutional Algorithmic Engine &amp; ONNX Neural Decision Brain
    </text>

    <!-- Metrics Badges Row -->
    <g transform="translate(0, 170)">
      <!-- Badge 1: Assets -->
      <rect x="0" y="0" width="180" height="50" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="20" y="24" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase">PORTFOLIO</text>
      <text x="20" y="42" fill="#00f2fe" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Top 30 Assets</text>

      <!-- Badge 2: Concurrency -->
      <rect x="195" y="0" width="180" height="50" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="215" y="24" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase">CONCURRENCY</text>
      <text x="215" y="42" fill="#00e676" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">50 Max Trades</text>

      <!-- Badge 3: Execution -->
      <rect x="390" y="0" width="180" height="50" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="410" y="24" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase">MICRO TIMEFRAME</text>
      <text x="410" y="42" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">M1 Lightning</text>

      <!-- Badge 4: Risk Shield -->
      <rect x="585" y="0" width="180" height="50" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="605" y="24" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-transform="uppercase">RISK SHIELD</text>
      <text x="605" y="42" fill="#ec4899" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">-$30.00 Hard Stop</text>
    </g>
  </g>
</svg>

