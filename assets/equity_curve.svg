<svg width="1000" height="450" viewBox="0 0 1000 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="eq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Area Fill Gradient -->
    <linearGradient id="eq-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#00e676" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00e676" stop-opacity="0.0" />
    </linearGradient>

    <!-- Stroke Line Gradient -->
    <linearGradient id="eq-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="60%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#1de9b6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="1000" height="450" rx="16" fill="url(#eq-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(40, 40)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Cumulative Performance &amp; Equity Curve</text>
    <text x="0" y="24" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Multi-Asset High-Frequency Scalping (M1 Timeframe • 30 Premier Assets)</text>
  </g>

  <!-- Metric Badges Top Right -->
  <g transform="translate(620, 28)">
    <!-- Badge 1: Profit Factor -->
    <rect x="0" y="0" width="100" height="42" rx="8" fill="#131b2e" stroke="#1e293b" />
    <text x="12" y="16" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">PROFIT FACTOR</text>
    <text x="12" y="34" fill="#00e676" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">1.68</text>

    <!-- Badge 2: Sharpe -->
    <rect x="110" y="0" width="100" height="42" rx="8" fill="#131b2e" stroke="#1e293b" />
    <text x="122" y="16" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">SHARPE RATIO</text>
    <text x="122" y="34" fill="#00f2fe" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">2.14</text>

    <!-- Badge 3: Max Drawdown -->
    <rect x="220" y="0" width="115" height="42" rx="8" fill="#131b2e" stroke="#1e293b" />
    <text x="232" y="16" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">MAX DRAWDOWN</text>
    <text x="232" y="34" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">2.4%</text>
  </g>

  <!-- Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" transform="translate(60, 110)">
    <!-- Horizontal lines -->
    <line x1="0" y1="0" x2="880" y2="0" />
    <text x="-40" y="4" fill="#475569" font-family="-apple-system, sans-serif" font-size="11">$115k</text>

    <line x1="0" y1="70" x2="880" y2="70" />
    <text x="-40" y="74" fill="#475569" font-family="-apple-system, sans-serif" font-size="11">$110k</text>

    <line x1="0" y1="140" x2="880" y2="140" />
    <text x="-40" y="144" fill="#475569" font-family="-apple-system, sans-serif" font-size="11">$105k</text>

    <line x1="0" y1="210" x2="880" y2="210" />
    <text x="-40" y="214" fill="#475569" font-family="-apple-system, sans-serif" font-size="11">$100k</text>

    <line x1="0" y1="280" x2="880" y2="280" />
    <text x="-40" y="284" fill="#475569" font-family="-apple-system, sans-serif" font-size="11">$95k</text>

    <!-- Vertical date labels -->
    <text x="0" y="305" fill="#475569" font-family="-apple-system, sans-serif" font-size="11">Sep 20</text>
    <text x="220" y="305" fill="#475569" font-family="-apple-system, sans-serif" font-size="11">Oct 05</text>
    <text x="440" y="305" fill="#475569" font-family="-apple-system, sans-serif" font-size="11">Oct 20</text>
    <text x="660" y="305" fill="#475569" font-family="-apple-system, sans-serif" font-size="11">Nov 05</text>
    <text x="850" y="305" fill="#00e676" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Nov 12 (Live)</text>
  </g>

  <!-- Area Fill Path -->
  <path d="M60 320 
           L60 320 
           C110 318, 140 310, 180 305 
           C220 300, 250 308, 290 295 
           C330 282, 360 270, 400 255 
           C440 240, 480 248, 520 230 
           C560 212, 600 205, 640 185 
           C680 165, 710 172, 750 150 
           C790 128, 830 115, 870 95 
           C900 80, 920 68, 940 55 
           L940 390 L60 390 Z" 
        fill="url(#eq-fill)" />

  <!-- Main Glowing Equity Curve Line -->
  <path d="M60 320 
           C110 318, 140 310, 180 305 
           C220 300, 250 308, 290 295 
           C330 282, 360 270, 400 255 
           C440 240, 480 248, 520 230 
           C560 212, 600 205, 640 185 
           C680 165, 710 172, 750 150 
           C790 128, 830 115, 870 95 
           C900 80, 920 68, 940 55" 
        fill="none" 
        stroke="url(#eq-stroke)" 
        stroke-width="3.5" 
        filter="url(#neon-glow)" />

  <!-- Current Terminal Point Indicator -->
  <circle cx="940" cy="55" r="7" fill="#00e676" />
  <circle cx="940" cy="55" r="14" fill="#00e676" opacity="0.3">
    <animate attributeName="r" values="7;18;7" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Callout Tooltip at End -->
  <g transform="translate(810, 20)">
    <rect width="120" height="26" rx="6" fill="#131b2e" stroke="#00e676" stroke-width="1"/>
    <text x="60" y="17" fill="#00e676" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">+14.2% Return</text>
  </g>
</svg>
